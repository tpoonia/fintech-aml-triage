[server]
headless = true
address = "0.0.0.0"
# Serves src/dashboard/static/ (vendored three.js + GSAP) at app/static/.
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#070B16"
secondaryBackgroundColor = "#0E1526"
textColor = "#E6EDF7"
font = "sans serif"
