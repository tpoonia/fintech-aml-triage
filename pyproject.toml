[project]
name = "qtrace"
version = "0.1.0"
description = "Q-TRACE: cost-aware selective quantum error mitigation for noisy quantum machine-learning fraud detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Mayank Kumar Pokhriyal" },
    { name = "Tushar Poonia" },
]
# Core scientific stack only. Phase-gated extras (xgboost, mitiq,
# qiskit-ibm-runtime, qiskit-aer-gpu) are added in the phase that needs them
# and recorded in docs/DECISIONS.md (E01).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
    "qiskit>=2.0,<3",
    "qiskit-aer>=0.17",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not slow and not qpu"]
markers = [
    "slow: long-running statistical or end-to-end checks (run with -m slow)",
    "qpu: touches real quantum hardware; never runs by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["qtrace"]
