# Runs the whole system with one command: docker compose up
#
# Two services from the same image — the scoring API and the analyst
# dashboard — because they scale differently in reality: the API handles
# transaction volume, the dashboard handles a handful of analysts.

services:
  api:
    build: .
    container_name: aml-api
    ports:
      - "8000:8000"
    volumes:
      # The SQLite database lives on a mounted volume so scored alerts and
      # analyst feedback survive container restarts. Without this, every
      # redeploy would wipe the alert history.
      - ./data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    container_name: aml-dashboard
    ports:
      - "8501:8501"
    environment:
      # Inside the compose network, services reach each other by service
      # name — "api" resolves to the API container, not localhost.
      - API_URL=http://api:8000
    depends_on:
      - api
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
